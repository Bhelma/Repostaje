name: Actualizar precios

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas: 00:17, 06:17, 12:17 y 18:17 UTC (GitHub puede retrasarlo un poco)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Descargar precios del Ministerio
        timeout-minutes: 20
        run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          git diff --cached --quiet && exit 0
          git commit -m "Precios actualizados"
          git pull --rebase -X theirs || true
          git push
